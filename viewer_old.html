<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>河川VR教材 - VR観察</title>

  <!-- 360°動画表示用 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #111;
    }

    a-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* 上部 */
    .top-bar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .title-box {
      max-width: min(72vw, 580px);
      padding: 11px 16px;
      border-radius: 12px;
      color: #111;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      text-align: left;
      pointer-events: auto;
    }

    #pointTitle {
      margin: 0 0 3px;
      font-size: clamp(20px, 3vw, 28px);
    }

    #pointDescription {
      margin: 0;
      font-size: clamp(13px, 1.8vw, 16px);
      line-height: 1.5;
    }

    /* 地点選択へ戻る */
    .back-button {
      display: inline-block;
      flex-shrink: 0;
      padding: 12px 16px;
      border: 2px solid #222;
      border-radius: 11px;
      background: rgba(255,255,255,0.94);
      color: #111;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      pointer-events: auto;
    }

    .back-button:hover {
      background: #eaf2f8;
    }

    /* 下部ボタン */
    .controls {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .control-button {
      border: 2px solid #222;
      border-radius: 12px;
      padding: 12px 18px;
      background: rgba(255,255,255,0.94);
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }

    .control-button:hover {
      background: #eaf2f8;
    }

    /* 岩石観察ボタン */
    #rockButton {
      background: rgba(255, 248, 220, 0.96);
    }

    #rockButton:hover {
      background: #fff0b8;
    }

    /* 最初の再生画面 */
    .start-overlay,
    .error-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.62);
    }

    .start-card,
    .error-card {
      width: min(92vw, 520px);
      padding: 28px;
      border-radius: 18px;
      background: white;
      color: #111;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.45);
    }

    .start-card h2,
    .error-card h2 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    .start-card p,
    .error-card p {
      margin: 0 0 20px;
      line-height: 1.7;
      font-size: 16px;
    }

    .start-button {
      border: 0;
      border-radius: 12px;
      padding: 14px 28px;
      background: #2471a3;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .error-overlay {
      display: none;
    }

    @media (max-width: 650px) {
      .top-bar {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .title-box {
        max-width: 60vw;
        padding: 9px 11px;
      }

      #pointDescription {
        display: none;
      }

      .back-button {
        padding: 10px 12px;
        font-size: 14px;
      }

      .controls {
        position: fixed;
  left: 50%;
  bottom: max(18px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 20;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;

  width: min(96%, 900px);

  pointer-events: auto;
      }

      .control-button {
        min-width: 130px;
  min-height: 52px;

  padding: 12px 18px;

  border: 2px solid #222;
  border-radius: 12px;

  background: rgba(255,255,255,0.95);
  color: #111;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      }
      .control-button:hover,
.control-button:focus {
  background: #eaf2f8;
}

/* 岩石観察ボタン */
#rockButton {
  background: rgba(255,248,220,0.96);
}

/* A-Frame標準の右下ボタンを非表示 */
.a-enter-vr-button,
.a-enter-ar-button {
  display: none !important;
}
/* ==============================
   全画面表示中
   ============================== */

/* 上の地点名と「地点選択に戻る」を消す */
:fullscreen .top-bar {
  display: none;
}

/* 岩石観察ボタンを消す */
:fullscreen #rockButton {
  display: none !important;
}

/* 全画面時の下部ボタン */
:fullscreen .controls {
  width: min(94%, 650px);
  bottom: max(22px, env(safe-area-inset-bottom));
  gap: 16px;
}

/* 全画面時のボタンを大きくする */
:fullscreen .control-button {
  flex: 1;
  min-width: 0;
  min-height: 58px;
  padding: 14px 16px;
  font-size: 18px;
}
/* Chromebook・タブレット */
@media (max-width: 900px) {

  .controls {
    width: 96%;
    gap: 8px;
  }

  .control-button {
    min-width: 105px;
    min-height: 50px;
    padding: 10px 12px;
    font-size: 15px;
  }

  :fullscreen .controls {
    width: 94%;
    max-width: 620px;
    gap: 10px;
  }

  :fullscreen .control-button {
    min-height: 58px;
    font-size: 17px;
  }
}
    }
  </style>
</head>

<body>

  <!-- 上部表示 -->
  <div class="top-bar">

    <div class="title-box">
      <h1 id="pointTitle">地点</h1>
      <p id="pointDescription">
        360°動画を読み込んでいます。
      </p>
    </div>

    <a href="index.html" class="back-button">
      地点選択に戻る
    </a>

  </div>


  <!-- 下部操作ボタン -->
  <div class="controls">
  <button
    class="control-button"
    id="playButton"
    type="button">
    ▶ 再生
  </button>

  <button
    class="control-button"
    id="pauseButton"
    type="button">
    ⏸ 一時停止
  </button>

  <button
    class="control-button"
    id="rockButton"
    type="button">
    足元の岩石を観察する
  </button>

  <button
    class="control-button"
    id="fullscreenButton"
    type="button">
    全画面表示
  </button>


  </div>


  <!-- 最初の再生画面 -->
  <div class="start-overlay" id="startOverlay">

    <div class="start-card">

      <h2 id="startTitle">
        VR動画を観察する
      </h2>

      <p>
        動画の中をドラッグすると、周囲を360°見渡せます。<br>
        川幅・流れ・河原の石などに注目してみよう。
      </p>

      <button
        class="start-button"
        id="startButton"
        type="button">
        動画を再生
      </button>

    </div>

  </div>


  <!-- エラー表示 -->
  <div class="error-overlay" id="errorOverlay">

    <div class="error-card">

      <h2>
        動画を読み込めませんでした
      </h2>

      <p id="errorMessage">
        動画ファイル名や保存場所を確認してください。
      </p>

      <a href="index.html" class="back-button">
        地点選択に戻る
      </a>

    </div>

  </div>


  <!-- 360°動画 -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets timeout="20000">

      <video
        id="vrVideo"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        preload="metadata"
        loop>
      </video>

    </a-assets>

    <a-videosphere
      id="videoSphere"
      src="#vrVideo"
      rotation="0 -90 0">
    </a-videosphere>

    <a-camera
      look-controls="magicWindowTrackingEnabled: false"
      wasd-controls-enabled="false">
    </a-camera>

  </a-scene>


  <script>

    /* ==============================
       地点ごとの動画
       ============================== */

    const pointData = {

      1: {
        title: "地点1　御嶽渓谷",
        description: "川の流れや河原の様子を観察しよう。",
        mainVideo: "videos/point1.mp4",
        rockVideo: "videos/point1_rock.mp4"
      },

      2: {
        title: "地点2　秋川渓谷",
        description: "川の流れや河原の様子を観察しよう。",
        mainVideo: "videos/point2.mp4",
        rockVideo: "videos/point2_rock.mp4"
      },

      3: {
        title: "地点3　釜の淵公園",
        description: "川の流れや河原の様子を観察しよう。",
        mainVideo: "videos/point3.mp4",
        rockVideo: "videos/point3_rock.mp4"
      },

      4: {
        title: "地点4　拝島",
        description: "川の様子を観察しよう。",
        mainVideo: "videos/point4.mp4"
      },

      5: {
        title: "地点5　丸子橋",
        description: "川の様子を観察しよう。",
        mainVideo: "videos/point5.mp4"
      },

      6: {
        title: "地点6　多摩川スカイブリッジ",
        description: "河口付近の川の様子を観察しよう。",
        mainVideo: "videos/point6.mp4"
      }

    };


    /* ==============================
       現在の地点を取得
       ============================== */

    const params =
      new URLSearchParams(window.location.search);

    const point = params.get("point");

    const selected =
      pointData[point];


    /* ==============================
       HTML要素
       ============================== */

    const video =
      document.getElementById("vrVideo");

    const pointTitle =
      document.getElementById("pointTitle");

    const pointDescription =
      document.getElementById("pointDescription");

    const startOverlay =
      document.getElementById("startOverlay");

    const startButton =
      document.getElementById("startButton");

    const startTitle =
      document.getElementById("startTitle");

    const playPauseButton =
      document.getElementById("playPauseButton");

    const rockButton =
      document.getElementById("rockButton");

    const fullscreenButton =
       document.getElementById("fullscreenButton");

    const errorOverlay =
      document.getElementById("errorOverlay");

    const errorMessage =
      document.getElementById("errorMessage");


    /* ==============================
       通常動画か岩石動画か
       ============================== */

    let showingRock = false;


    /* ==============================
       地点を読み込む
       ============================== */

    if (!selected) {

      startOverlay.style.display = "none";

      errorOverlay.style.display = "flex";

      errorMessage.textContent =
        "地点が正しく指定されていません。";

    } else {

      pointTitle.textContent =
        selected.title;

      pointDescription.textContent =
        selected.description;

      startTitle.textContent =
        selected.title + "を観察する";

      document.title =
        "河川VR教材 - " + selected.title;

      video.src =
        selected.mainVideo;

      video.load();


      /* 地点4～6は岩石ボタンを表示しない */

      if (!selected.rockVideo) {

        rockButton.style.display = "none";

      }

    }


    /* ==============================
       最初の再生
       ============================== */

    async function startVideo() {

      try {

        await video.play();

        startOverlay.style.display =
          "none";

        playPauseButton.textContent =
          "一時停止";

      } catch (error) {

        errorOverlay.style.display =
          "flex";

        errorMessage.textContent =
          "動画を再生できませんでした。";

      }

    }

    startButton.addEventListener(
      "click",
      startVideo
    );


    /* ==============================
       再生・一時停止
       ============================== */

    playPauseButton.addEventListener(
      "click",
      async () => {

        if (video.paused) {

          try {

            await video.play();

            playPauseButton.textContent =
              "一時停止";

          } catch (error) {

            errorOverlay.style.display =
              "flex";

          }

        } else {

          video.pause();

          playPauseButton.textContent =
            "再生";

        }

      }
    );


    /* ==============================
       岩石動画への切り替え
       ============================== */

    rockButton.addEventListener(
      "click",
      async () => {

        if (!selected.rockVideo) {
          return;
        }


        /* 岩石動画 → 全体動画 */

        if (showingRock) {

          video.pause();

          video.src =
            selected.mainVideo;

          video.load();

          pointDescription.textContent =
            "川の流れや河原の様子を観察しよう。";

          rockButton.textContent =
            "足元の岩石を観察する";

          showingRock = false;


        /* 全体動画 → 岩石動画 */

        } else {

          video.pause();

          video.src =
            selected.rockVideo;

          video.load();

          pointDescription.textContent =
            "足元の岩石の大きさや形に注目して観察しよう。";

          rockButton.textContent =
            "地点全体の様子に戻る";

          showingRock = true;

        }


        /* 切り替えた動画を再生 */

        try {

          await video.play();

          playPauseButton.textContent =
            "一時停止";

        } catch (error) {

          errorOverlay.style.display =
            "flex";

          errorMessage.textContent =
            "動画を読み込めませんでした。";

        }

      }
    );


    /* ==============================
       動画読み込みエラー
       ============================== */

    video.addEventListener(
      "error",
      () => {

        errorOverlay.style.display =
          "flex";

        errorMessage.textContent =
          "動画ファイルを読み込めませんでした。ファイル名と保存場所を確認してください。";

      }
    );
/* ==============================
   全画面表示
   ============================== */

fullscreenButton.addEventListener(
  "click",
  async () => {

    if (!document.fullscreenElement) {

      try {

        await document.documentElement.requestFullscreen();

      } catch (error) {

        console.log("全画面表示にできませんでした");

      }

    } else {

      try {

        await document.exitFullscreen();

      } catch (error) {

        console.log("全画面表示を終了できませんでした");

      }

    }

  }
);


/* ==============================
   全画面ボタンの文字を変更
   ============================== */

document.addEventListener(
  "fullscreenchange",
  () => {

    if (document.fullscreenElement) {

      fullscreenButton.textContent =
        "全画面を終了";

    } else {

      fullscreenButton.textContent =
        "全画面表示";

    }

  }
);
  </script>

</body>
</html>
