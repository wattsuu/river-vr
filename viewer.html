<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>河川VR教材 - VR観察</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <script>
    /*
      タッチ端末用の補助操作。
      A-Frame のジャイロ追従はカメラ側に残し、
      指ドラッグ分だけ親の cameraRig を回転させる。
      これにより上下・左右の指操作と端末追従を併用する。
    */
    AFRAME.registerComponent("touch-drag-look", {
      schema: {
        sensitivity: { type: "number", default: 0.16 },
        maxPitch: { type: "number", default: 80 }
      },

      init: function () {
        this.dragging = false;
        this.lastX = 0;
        this.lastY = 0;
        this.pitch = 0;
        this.yaw = 0;

        this.onTouchStart = this.onTouchStart.bind(this);
        this.onTouchMove = this.onTouchMove.bind(this);
        this.onTouchEnd = this.onTouchEnd.bind(this);
        this.attachListeners = this.attachListeners.bind(this);

        if (this.el.sceneEl && this.el.sceneEl.canvas) {
          this.attachListeners();
        } else if (this.el.sceneEl) {
          this.el.sceneEl.addEventListener(
            "render-target-loaded",
            this.attachListeners,
            { once: true }
          );
        }
      },

      attachListeners: function () {
        const canvas = this.el.sceneEl && this.el.sceneEl.canvas;
        if (!canvas) return;

        this.canvas = canvas;

        canvas.style.touchAction = "none";

        canvas.addEventListener(
          "touchstart",
          this.onTouchStart,
          { passive: false }
        );

        canvas.addEventListener(
          "touchmove",
          this.onTouchMove,
          { passive: false }
        );

        canvas.addEventListener(
          "touchend",
          this.onTouchEnd,
          { passive: false }
        );

        canvas.addEventListener(
          "touchcancel",
          this.onTouchEnd,
          { passive: false }
        );
      },

      onTouchStart: function (event) {
        if (event.touches.length !== 1) return;

        event.preventDefault();

        const touch = event.touches[0];

        this.dragging = true;
        this.lastX = touch.clientX;
        this.lastY = touch.clientY;
      },

      onTouchMove: function (event) {
        if (!this.dragging || event.touches.length !== 1) return;

        event.preventDefault();

        const touch = event.touches[0];

        const dx = touch.clientX - this.lastX;
        const dy = touch.clientY - this.lastY;

        this.lastX = touch.clientX;
        this.lastY = touch.clientY;

        this.yaw -= dx * this.data.sensitivity;
        this.pitch -= dy * this.data.sensitivity;

        this.pitch = Math.max(
          -this.data.maxPitch,
          Math.min(this.data.maxPitch, this.pitch)
        );

        this.el.object3D.rotation.set(
          THREE.MathUtils.degToRad(this.pitch),
          THREE.MathUtils.degToRad(this.yaw),
          0
        );
      },

      onTouchEnd: function (event) {
        if (event) event.preventDefault();
        this.dragging = false;
      },

      remove: function () {
        if (!this.canvas) return;

        this.canvas.removeEventListener("touchstart", this.onTouchStart);
        this.canvas.removeEventListener("touchmove", this.onTouchMove);
        this.canvas.removeEventListener("touchend", this.onTouchEnd);
        this.canvas.removeEventListener("touchcancel", this.onTouchEnd);
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #111;
    }

    a-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    a-scene canvas {
      touch-action: none !important;
      overscroll-behavior: none !important;
    }

    .top-bar {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .title-box {
      max-width: min(68vw, 520px);
      padding: 11px 16px;
      border-radius: 12px;
      color: #111;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      text-align: left;
      pointer-events: auto;
    }

    #pointTitle {
      margin: 0;
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.3;
    }

    .back-button {
      display: inline-block;
      flex-shrink: 0;
      padding: 12px 16px;
      border: 2px solid #222;
      border-radius: 11px;
      background: rgba(255,255,255,0.94);
      color: #111;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      pointer-events: auto;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: min(96%, 920px);
      pointer-events: auto;
    }

    .control-button {
      min-width: 128px;
      min-height: 52px;
      padding: 12px 18px;
      border: 2px solid #222;
      border-radius: 12px;
      background: rgba(255,255,255,0.95);
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      touch-action: manipulation;
    }

    #rockButton {
      background: rgba(255,248,220,0.96);
    }

    .a-enter-vr-button,
    .a-enter-ar-button {
      display: none !important;
    }

    .start-overlay,
    .error-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.62);
      touch-action: manipulation;
    }

    .start-card,
    .error-card {
      width: min(92vw, 520px);
      padding: 28px;
      border-radius: 18px;
      background: white;
      color: #111;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.45);
    }

    .start-card h2,
    .error-card h2 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    .start-card p,
    .error-card p {
      margin: 0 0 20px;
      line-height: 1.7;
      font-size: 16px;
    }

    .start-button {
      border: 0;
      border-radius: 12px;
      padding: 14px 28px;
      background: #2471a3;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .error-overlay {
      display: none;
    }

    :fullscreen .top-bar,
    :-webkit-full-screen .top-bar,
    body.pseudo-fullscreen .top-bar {
      display: none;
    }

    :fullscreen #rockButton,
    :-webkit-full-screen #rockButton,
    body.pseudo-fullscreen #rockButton {
      display: none !important;
    }

    :fullscreen .controls,
    :-webkit-full-screen .controls,
    body.pseudo-fullscreen .controls {
      width: min(94%, 650px);
      bottom: max(22px, env(safe-area-inset-bottom));
      gap: 16px;
      flex-wrap: nowrap;
    }

    :fullscreen .control-button,
    :-webkit-full-screen .control-button,
    body.pseudo-fullscreen .control-button {
      flex: 1;
      min-width: 0;
      min-height: 60px;
      padding: 14px 16px;
      font-size: 18px;
    }

    @media (max-width: 900px) {
      .controls {
        width: 96%;
        gap: 8px;
      }

      .control-button {
        min-width: 105px;
        min-height: 52px;
        padding: 10px 12px;
        font-size: 15px;
      }

      :fullscreen .controls,
      :-webkit-full-screen .controls,
      body.pseudo-fullscreen .controls {
        width: 94%;
        max-width: 620px;
        gap: 10px;
      }

      :fullscreen .control-button,
      :-webkit-full-screen .control-button,
      body.pseudo-fullscreen .control-button {
        min-height: 60px;
        font-size: 17px;
      }
    }

    @media (max-width: 650px) {
      .top-bar {
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
      }

      .title-box {
        max-width: 58vw;
        padding: 9px 11px;
      }

      #pointTitle {
        font-size: 18px;
      }

      .back-button {
        padding: 10px 12px;
        font-size: 14px;
      }

      .controls {
        flex-wrap: wrap;
      }

      .control-button {
        min-width: 44%;
      }

      :fullscreen .controls,
      :-webkit-full-screen .controls,
      body.pseudo-fullscreen .controls {
        flex-wrap: nowrap;
      }

      :fullscreen .control-button,
      :-webkit-full-screen .control-button,
      body.pseudo-fullscreen .control-button {
        min-width: 0;
        font-size: 14px;
        padding: 10px 5px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <div class="title-box">
      <h1 id="pointTitle">地点</h1>
    </div>

    <a href="index.html" class="back-button">
      地点選択に戻る
    </a>
  </div>

  <div class="controls">
    <button class="control-button" id="playButton" type="button">
      ▶ 再生
    </button>

    <button class="control-button" id="pauseButton" type="button">
      ⏸ 一時停止
    </button>

    <button class="control-button" id="rockButton" type="button">
      足元の岩石を観察する
    </button>

    <button class="control-button" id="fullscreenButton" type="button">
      全画面表示
    </button>
  </div>

  <div class="start-overlay" id="startOverlay">
    <div class="start-card">
      <h2 id="startTitle">VR動画を観察する</h2>

      <p>
        画面を指やマウスで動かすと、周囲を360°見渡せます。<br>
        対応端末では、端末自体を動かして視点を変えることもできます。
      </p>

      <button class="start-button" id="startButton" type="button">
        動画を再生
      </button>
    </div>
  </div>

  <div class="error-overlay" id="errorOverlay">
    <div class="error-card">
      <h2>動画を読み込めませんでした</h2>

      <p id="errorMessage">
        動画ファイル名や保存場所を確認してください。
      </p>

      <a href="index.html" class="back-button">
        地点選択に戻る
      </a>
    </div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets timeout="20000">
      <video
        id="vrVideo"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        preload="metadata"
        loop>
      </video>
    </a-assets>

    <a-videosphere
      id="videoSphere"
      src="#vrVideo"
      rotation="0 -90 0">
    </a-videosphere>

    <a-entity
      id="cameraRig"
      touch-drag-look="sensitivity: 0.16; maxPitch: 80"
    >
      <a-camera
        id="mainCamera"
        look-controls="
          mouseEnabled: true;
          touchEnabled: false;
          magicWindowTrackingEnabled: true"
        wasd-controls-enabled="false">
      </a-camera>
    </a-entity>
  </a-scene>

  <script>
    const pointData = {
      1: {
        title: "地点1　御嶽渓谷",
        mainVideo: "videos/point1.mp4",
        rockVideo: "videos/point1_rock.mp4"
      },
      2: {
        title: "地点2　秋川渓谷",
        mainVideo: "videos/point2.mp4",
        rockVideo: "videos/point2_rock.mp4"
      },
      3: {
        title: "地点3　釜の淵公園",
        mainVideo: "videos/point3.mp4",
        rockVideo: "videos/point3_rock.mp4"
      },
      4: {
        title: "地点4　拝島",
        mainVideo: "videos/point4.mp4"
      },
      5: {
        title: "地点5　丸子橋",
        mainVideo: "videos/point5.mp4"
      },
      6: {
        title: "地点6　多摩川スカイブリッジ",
        mainVideo: "videos/point6.mp4"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const point = params.get("point");
    const selected = pointData[point];

    const video = document.getElementById("vrVideo");
    const pointTitle = document.getElementById("pointTitle");
    const startOverlay = document.getElementById("startOverlay");
    const startButton = document.getElementById("startButton");
    const startTitle = document.getElementById("startTitle");
    const playButton = document.getElementById("playButton");
    const pauseButton = document.getElementById("pauseButton");
    const rockButton = document.getElementById("rockButton");
    const fullscreenButton = document.getElementById("fullscreenButton");
    const errorOverlay = document.getElementById("errorOverlay");
    const errorMessage = document.getElementById("errorMessage");

    let showingRock = false;

    if (!selected) {
      startOverlay.style.display = "none";
      errorOverlay.style.display = "flex";
      errorMessage.textContent =
        "地点が正しく指定されていません。地点選択画面から選び直してください。";
    } else {
      pointTitle.textContent = selected.title;
      startTitle.textContent = selected.title + "を観察する";
      document.title = "河川VR教材 - " + selected.title;

      video.src = selected.mainVideo;
      video.load();

      if (!selected.rockVideo) {
        rockButton.style.display = "none";
      }
    }

    async function requestOrientationPermissionIfNeeded() {
      try {
        const requests = [];

        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
          requests.push(DeviceOrientationEvent.requestPermission());
        }

        if (
          typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function"
        ) {
          requests.push(DeviceMotionEvent.requestPermission());
        }

        if (requests.length > 0) {
          await Promise.allSettled(requests);
        }
      } catch (error) {
        console.log(
          "端末方向センサーの許可を取得できませんでした。",
          error
        );
      }
    }

    async function startVideo() {
      if (!selected) return;

      await requestOrientationPermissionIfNeeded();

      try {
        await video.play();
        startOverlay.style.display = "none";
      } catch (error) {
        console.error(error);
        errorOverlay.style.display = "flex";
        errorMessage.textContent =
          "動画を再生できませんでした。動画ファイル名・保存場所・形式を確認してください。";
      }
    }

    startButton.addEventListener("click", startVideo);

    playButton.addEventListener("click", async () => {
      if (!selected) return;

      try {
        await video.play();
      } catch (error) {
        console.error(error);
        errorOverlay.style.display = "flex";
        errorMessage.textContent =
          "動画を再生できませんでした。";
      }
    });

    pauseButton.addEventListener("click", () => {
      video.pause();
    });

    rockButton.addEventListener("click", async () => {
      if (!selected || !selected.rockVideo) return;

      video.pause();

      if (showingRock) {
        video.src = selected.mainVideo;
        rockButton.textContent = "足元の岩石を観察する";
        showingRock = false;
      } else {
        video.src = selected.rockVideo;
        rockButton.textContent = "地点全体の様子に戻る";
        showingRock = true;
      }

      video.load();

      try {
        await video.play();
      } catch (error) {
        console.error(error);
        errorOverlay.style.display = "flex";
        errorMessage.textContent =
          "切り替えた動画を再生できませんでした。動画ファイル名と保存場所を確認してください。";
      }
    });

    video.addEventListener("error", () => {
      const currentSource =
        video.currentSrc ||
        video.getAttribute("src") ||
        "";

      console.error("動画読み込みエラー:", currentSource);

      errorOverlay.style.display = "flex";
      errorMessage.textContent =
        "動画ファイルを読み込めませんでした。videosフォルダ内のファイル名と保存場所を確認してください。";
    });

    function isRealFullscreen() {
      return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement
      );
    }

    function isPseudoFullscreen() {
      return document.body.classList.contains(
        "pseudo-fullscreen"
      );
    }

    function updateFullscreenButton() {
      const active =
        isRealFullscreen() ||
        isPseudoFullscreen();

      fullscreenButton.textContent =
        active ? "全画面を終了" : "全画面表示";
    }

    function togglePseudoFullscreen(force) {
      if (typeof force === "boolean") {
        document.body.classList.toggle(
          "pseudo-fullscreen",
          force
        );
      } else {
        document.body.classList.toggle(
          "pseudo-fullscreen"
        );
      }

      updateFullscreenButton();
    }

    fullscreenButton.addEventListener("click", async () => {
      if (isPseudoFullscreen()) {
        togglePseudoFullscreen(false);
        return;
      }

      if (isRealFullscreen()) {
        try {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        } catch (error) {
          console.error("全画面終了エラー:", error);
        }
        return;
      }

      try {
        if (
          document.fullscreenEnabled &&
          document.documentElement.requestFullscreen
        ) {
          await document.documentElement.requestFullscreen();
          return;
        }

        if (
          document.documentElement.webkitRequestFullscreen
        ) {
          document.documentElement.webkitRequestFullscreen();
          return;
        }

        togglePseudoFullscreen(true);

      } catch (error) {
        console.log(
          "真の全画面表示が利用できないため、擬似全画面に切り替えます。",
          error
        );

        togglePseudoFullscreen(true);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (isRealFullscreen()) {
        togglePseudoFullscreen(false);
      }
      updateFullscreenButton();
    });

    document.addEventListener("webkitfullscreenchange", () => {
      if (isRealFullscreen()) {
        togglePseudoFullscreen(false);
      }
      updateFullscreenButton();
    });

    updateFullscreenButton();
  </script>
</body>
</html>
