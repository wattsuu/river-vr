<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>河川VR教材</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f8fb;
      font-family: sans-serif;
    }

    .map-container {
      position: relative;
      width: min(100%, 1200px);
      margin: 0 auto;
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    /* 透明なクリック領域 */
    .hotspot {
      position: absolute;
      display: block;
      background: transparent;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      z-index: 10;
    }

    /* マウスを乗せたときだけ薄く表示 */
    .hotspot:hover,
    .hotspot:focus {
      background: rgba(255,255,255,0.18);
      outline: 3px solid rgba(255,255,255,0.75);
    }

    /* 地点1：御嶽渓谷 */
    .point1 {
      left: 5%;
      top: 25%;
      width: 18%;
      height: 11%;
    }

    /* 地点2：秋川渓谷 */
    .point2 {
      left: 6%;
      top: 47%;
      width: 18%;
      height: 11%;
    }

    /* 地点3：釜の淵公園 */
    .point3 {
      left: 30%;
      top: 41%;
      width: 17%;
      height: 10%;
    }

    /* 地点4：拝島駅 */
    .point4 {
      left: 44%;
      top: 50%;
      width: 17%;
      height: 10%;
    }

    /* 地点5：丸子橋 */
    .point5 {
      left: 65%;
      top: 58%;
      width: 15%;
      height: 10%;
    }

    /* 地点6：多摩川スカイブリッジ */
    .point6 {
      left: 82%;
      top: 65%;
      width: 18%;
      height: 12%;
    }

  </style>
</head>

<body>

  <div class="map-container">

    <img
      src="images/tamagawa-map.png"
      alt="多摩川の地点選択マップ"
      class="map-image"
    >

    <!-- 地点1 -->
    <a
      href="viewer.html?point=1"
      class="hotspot point1"
      aria-label="地点1 御嶽渓谷を観察する">
    </a>

    <!-- 地点2 -->
    <a
      href="viewer.html?point=2"
      class="hotspot point2"
      aria-label="地点2 秋川渓谷を観察する">
    </a>

    <!-- 地点3 -->
    <a
      href="viewer.html?point=3"
      class="hotspot point3"
      aria-label="地点3 釜の淵公園を観察する">
    </a>

    <!-- 地点4 -->
    <a
      href="viewer.html?point=4"
      class="hotspot point4"
      aria-label="地点4 拝島駅を観察する">
    </a>

    <!-- 地点5 -->
    <a
      href="viewer.html?point=5"
      class="hotspot point5"
      aria-label="地点5 丸子橋を観察する">
    </a>

    <!-- 地点6 -->
    <a
      href="viewer.html?point=6"
      class="hotspot point6"
      aria-label="地点6 多摩川スカイブリッジを観察する">
    </a>

  </div>

</body>
</html>
